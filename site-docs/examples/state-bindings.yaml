version: 0
workflow: remember-profile
inputs:
  active_profile_key: {}
state_needs:
  shared_state: {}
state_bindings:
  shared_state: shared_state
let:
  active_profile: state.shared_state[inputs.active_profile_key]
blocks:
  - steps:
      - name: remember
        state_set:
          state.shared_state["active_profile"]: active_profile
