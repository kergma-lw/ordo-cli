version: 0
workflow: text-adapter-demo
inputs:
  body:
    type: string
  replacement:
    type: string
steps:
- name: replace-all-hell
  value: 'text.finds("hell")->replace(replacement) with{root: inputs.body, replacement:
    inputs.replacement}'
  register: updated
- name: first-line-after-prefix
  value: 'text.lines[0].after(": ") with{root: step.updated.outputs.value}'
  register: first_line_value
