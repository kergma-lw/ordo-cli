version: 0
workflow: inspect-project-items-by-custom-field
inputs:
  project_id: PVT_DEMO
  filters:
  - field: "Work type"
    value: "Task"
let:
  matching_items: gh.project.items(project_id=inputs.project_id, filters=inputs.filters)
blocks:
- guards:
  - matching_items.count != 0
- steps:
  - name: Publish matching item count
    publish:
      summary: "Project items matching the custom field loaded"
      count: matching_items.count
