version: 0
workflow: inspect-git-tags
inputs:
  tag_name: {}
blocks:
   - guards: []
   - steps:
      # Inspect exact and release tags, then publish the summary.
      - name: Inspect exact tag
        uses: git.tag
        with:
          name: inputs.tag_name
        register: exact_tag
      - name: Inspect release tags
        uses: git.tags
        with:
          match: "v*"
          match_kind: "glob"
        register: release_tags
      - name: Publish summary
        publish:
          tag_exists: step.exact_tag.outputs.exists
          tag_target_oid: step.exact_tag.outputs.target_oid
          tag_target_type: step.exact_tag.outputs.target_type
          release_tag_count: step.release_tags.outputs.count
          summary: "Git tag workflow prepared"
