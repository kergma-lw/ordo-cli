[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
version = "0.0.0"
description = "Contract-first local workflow runtime"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6,<7",
]

[project.scripts]
ordo-playbook = "ordo.cli:main"
ordo-help = "ordo.help_cli:main"

[tool.setuptools]
package-dir = {ordo = "src/ordo", connectors = "connectors"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ordo*", "connectors*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
