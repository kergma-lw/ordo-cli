[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm[simple]>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
dynamic = ["version"]
description = "Contract-first local workflow runtime"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6,<7",
]

[project.scripts]
ordo-playbook = "ordo.cli:main"
ordo-help = "ordo.help_cli:main"
ordo-human-help-audit = "ordo.human_help_audit:main"

[tool.setuptools]
package-dir = {ordo = "src/ordo", connectors = "connectors"}

[tool.setuptools_scm]
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
fallback_version = "0.1.dev0"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ordo*", "connectors*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
