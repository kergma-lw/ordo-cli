[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
version = "0.0.0"
description = "Contract-first local workflow runtime"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = {ordo = "src/ordo", connectors = "connectors"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ordo*", "connectors*"]
exclude = ["tests*"]
