[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ordo"
version = "0.0.0"
description = "Contract-first local workflow runtime"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
