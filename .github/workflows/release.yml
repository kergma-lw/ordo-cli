name: Release

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation value generated by Ordo
        required: true
        type: string
      tag:
        description: Exact unused release tag
        required: true
        type: string
      expected_sha:
        description: Exact commit that the release tag must name
        required: true
        type: string

run-name: ${{ inputs.request_id }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate release inputs
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Refuse an existing release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            printf 'Release tag already exists: %s\n' "$TAG" >&2
            exit 1
          fi

      - name: Install test, build, and audit dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            'build>=1,<2' 'pytest>=8,<9' 'PyYAML>=6,<7' 'shellcheck-py==0.11.0.1' \
            'bandit==1.9.4' 'semgrep==1.176.1' 'pip-audit==2.10.1'
          gitleaks_archive="$RUNNER_TEMP/gitleaks_8.20.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$gitleaks_archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.20.1/gitleaks_8.20.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            8c0fdf050ec8bd9f8b5f4833c6dc81f4c20cb35625418216924949a22b6030bc \
            "$gitleaks_archive" | sha256sum --check --status
          install --directory "$HOME/.local/bin"
          tar --extract --gzip --file "$gitleaks_archive" --directory "$HOME/.local/bin" gitleaks
          "$HOME/.local/bin/gitleaks" version | grep --fixed-strings --line-regexp 8.20.1
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Run full test suite
        run: .venv/bin/python -m pytest

      - name: Run underlying publication audit commands
        run: |
          .ordo/scripts/audit-gitleaks-tree.sh
          .ordo/scripts/audit-gitleaks-history.sh
          .ordo/scripts/audit-gitleaks-metadata.sh
          .ordo/scripts/audit-bandit.sh
          .ordo/scripts/audit-semgrep.sh
          .ordo/scripts/audit-pip-audit.sh true
          .ordo/scripts/audit-shellcheck.sh
          .ordo/scripts/audit-publication-inventory.sh

      - name: Build the release wheel
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ORDO="$version" .venv/bin/python -m build --wheel

      - name: Verify the release wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/ordo-wheel-check"
          "$RUNNER_TEMP/ordo-wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ordo-wheel-check/bin/ordo-playbook" --help
          "$RUNNER_TEMP/ordo-wheel-check/bin/ordo-help" --help

      - name: Recheck release tag before creation
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            printf 'Release tag appeared during verification: %s\n' "$TAG" >&2
            exit 1
          fi

      - name: Create and publish annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" "$EXPECTED_SHA" --message "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"

      - name: Publish wheel in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --title "Ordo $TAG" --generate-notes
