name: Release

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation value generated by Ordo
        required: true
        type: string
      tag:
        description: Exact unused release tag
        required: true
        type: string
      expected_sha:
        description: Exact commit that the release tag must name
        required: true
        type: string

run-name: ${{ inputs.request_id }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate release inputs
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Refuse an existing release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            printf 'Release tag already exists: %s\n' "$TAG" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install test and audit dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            'pytest>=8,<9' 'PyYAML>=6,<7' 'shellcheck-py==0.11.0.1' \
            'bandit==1.9.4' 'semgrep==1.176.1' 'pip-audit==2.10.1'
          GOBIN="$HOME/.local/bin" go install github.com/zricethezav/gitleaks/v8@v8.20.1
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Run full test suite
        run: .venv/bin/python -m pytest

      - name: Run underlying publication audit commands
        run: |
          .ordo/scripts/audit-gitleaks-tree.sh
          .ordo/scripts/audit-gitleaks-history.sh
          .ordo/scripts/audit-gitleaks-metadata.sh
          .ordo/scripts/audit-bandit.sh
          .ordo/scripts/audit-semgrep.sh
          .ordo/scripts/audit-pip-audit.sh true
          .ordo/scripts/audit-shellcheck.sh
          .ordo/scripts/audit-publication-inventory.sh

      - name: Recheck release tag before creation
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            printf 'Release tag appeared during verification: %s\n' "$TAG" >&2
            exit 1
          fi

      - name: Create and publish annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" "$EXPECTED_SHA" --message "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
