description: Compute, create, or switch to a task branch after syncing the main branch state
args:
  project_type: string
  issue_number: integer
  issue_title: string

steps:
  - name: compute-branch-name
    value:
      format: "%s/%s-%s"
      args:
        - ${args.project_type | lower}
        - ${args.issue_number}
        - ${args.issue_title | slug}
    register: branch

  - name: probe-local-main-ref
    uses: git.ref
    with:
      ref: refs/heads/main
    register: local_main

  - name: fetch-origin
    uses: git.sync.fetch
    with:
      remote: origin

  - name: probe-remote-main-ref
    uses: git.ref
    with:
      ref: refs/remotes/origin/main
    register: remote_main

  - name: switch-main
    if: ${step.local_main.outputs.exists}
    uses: git.branch.switch
    with:
      branch: main

  - name: merge-origin-main-ff-only
    if: ${step.local_main.outputs.exists and step.remote_main.outputs.exists}
    uses: git.integrate.merge_ff_only
    with:
      ref: refs/remotes/origin/main

  - name: probe-target-branch-ref
    uses: git.ref
    with:
      ref:
        format: "refs/heads/%s"
        args:
          - ${step.branch.outputs.value}
    register: target_branch

  - name: switch-existing-target-branch
    if: ${step.target_branch.outputs.exists}
    uses: git.branch.switch
    with:
      branch: ${step.branch.outputs.value}

  - name: create-target-branch-from-local-main
    if: ${not step.target_branch.outputs.exists and step.local_main.outputs.exists}
    uses: git.branch.create
    with:
      branch: ${step.branch.outputs.value}
      start_point: refs/heads/main

  - name: create-target-branch-from-remote-main
    if: ${not step.target_branch.outputs.exists and not step.local_main.outputs.exists}
    uses: git.branch.create
    with:
      branch: ${step.branch.outputs.value}
      start_point: refs/remotes/origin/main

  - name: switch-created-target-branch
    if: ${not step.target_branch.outputs.exists}
    uses: git.branch.switch
    with:
      branch: ${step.branch.outputs.value}
