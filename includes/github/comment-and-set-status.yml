description: Optionally comment on an issue and optionally set its project status
args:
  issue_number: integer
  comment:
    type: string
    default: ""
  status:
    type: string
    default: ""

steps:
  - name: add-comment
    if: args.comment | ne("")
    uses: gh.issue.comment.add
    with:
      repository: ${inputs.repository}
      issue_number: ${args.issue_number}
      body: ${args.comment}

  - name: set-task-status
    if: args.status | ne("")
    uses: gh.project.issue.field_single_select.set
    with:
      repository: ${inputs.repository}
      issue_number: ${args.issue_number}
      project_id: ${inputs.project_id}
      field: Status
      option: ${args.status}
