version: 0
workflow: open-task
inputs:
  issue_number: {}
blocks:
  - guards:
      - uses: git.repo
      - inputs.repo_kind == "meta" or git.worktree.clean == true
      - gh.issue(repository=inputs.repository, issue_number=inputs.issue_number).state == "OPEN"
  - steps:
      - name: load-issue
        uses: gh.issue
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}
        register: issue

      - name: probe-project-membership
        uses: gh.project.issue
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}
          project_id: ${inputs.project_id}
        register: project_probe

      - name: add-issue-to-project
        if: ${step.project_probe.outputs.exists | not}
        uses: gh.project.issue.add
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}
          project_id: ${inputs.project_id}

      - name: load-project-fields
        uses: gh.project.issue
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}
          project_id: ${inputs.project_id}
        register: project

  - guards:
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).exists
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).status != "Done"
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).status != "In review"
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).status != "Backlog"
      - inputs.repo_kind != "meta" or gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).type == "Story"
      - inputs.repo_kind == "meta" or gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).type == "Task" or gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).type == "Bug"

  - steps:
      - name: set-status-in-progress
        uses: gh.project.issue.status.set
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}
          project_id: ${inputs.project_id}
          status: In progress

      - name: compute-branch-name
        value:
          format: "%s/%s-%s"
          args:
            - ${step.project.outputs.type | lower}
            - ${step.issue.outputs.number}
            - ${step.issue.outputs.title | slug}
        register: branch

      - name: prepare-task-branch
        if: ${inputs.repo_kind | ne("meta")}
        uses: shell.command
        with:
          command:
            format: >-
              bash -lc 'branch="%s"; base_ref=""; if git show-ref --verify --quiet refs/heads/main; then if git switch main >/dev/null 2>&1; then git pull --ff-only; base_ref="main"; else git fetch origin main; base_ref="origin/main"; fi; else git fetch origin main; base_ref="origin/main"; fi; if git show-ref --verify --quiet "refs/heads/$branch"; then git switch "$branch"; else git switch -c "$branch" "$base_ref"; fi'
            args:
              - ${step.branch.outputs.value}

      - name: refresh-frontend-generated-artifacts
        if: ${inputs.repo_kind | eq("frontend")}
        uses: shell.command
        with:
          command: >-
            bash -lc 'set -euo pipefail; export NVM_DIR=${NVM_DIR:-$HOME/.nvm}; if [[ -s "$NVM_DIR/nvm.sh" ]]; then source "$NVM_DIR/nvm.sh" --no-use; fi; if ! type nvm >/dev/null 2>&1; then echo "error: nvm is required for frontend open-task" >&2; exit 1; fi; nvm use >/dev/null; if ! (npm run openapi || npx --yes openapi-typescript ../backend/openapi.snapshot.json -o src/api/types.gen.ts --root-types --root-types-no-schema-prefix); then echo "error: openapi refresh failed" >&2; exit 1; fi; npm run errors:sync; gen_out=$(git status --porcelain=v1 -- src/api/types.gen.ts src/api/error-codes.gen.ts || true); if [[ -n "$gen_out" ]]; then git add src/api/types.gen.ts src/api/error-codes.gen.ts; git commit -m "chore(openapi): regenerate api types"; else npm run check; fi'
