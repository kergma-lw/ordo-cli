version: 0
workflow: set-active-task
inputs:
  issue_number:
    description: Issue to start or resume.
  repository:
    description: GitHub OWNER/REPO.
  project_id:
    description: GitHub project ID.
state_needs:
  common_state: {}
let:
  active_issue: state.common_state[inputs.repository].issue_number | catch(["runtime.value.state_missing"], null)
  issue: gh.issue(repository=inputs.repository, issue_number=inputs.issue_number)
  project_issue: gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number,
    project_id=inputs.project_id)
blocks:
- guards:
  - inputs.issue_number | is_integer
  - inputs.repository | is_string
  - inputs.project_id | is_string
  - active_issue == null or active_issue == inputs.issue_number
- guards:
  - inputs.repository != ""
  - inputs.project_id != ""
  - gh.project.field(project_id=inputs.project_id, field="Status").exists
  - gh.project.field.option(project_id=inputs.project_id, field="Status", option="In progress").exists
  - git.repo.exists
  - git.worktree.clean
  - issue.state == "OPEN"
  - project_issue.exists
  - project_issue.status != "Done"
  - project_issue.type == "Story" or project_issue.type == "Task" or project_issue.type == "Bug"
  - project_issue.type == "Story" or project_issue.status == "Ready" or project_issue.status == "In progress"
- steps:
  - name: Load branch issue
    uses: gh.issue
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
    register: branch_issue
  - name: Load branch project item
    uses: gh.project.issue
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
      project_id: inputs.project_id
    register: branch_project
  - name: Compute branch name
    value:
      format: "{}/{}-{}"
      args:
      - step.branch_project.outputs.type | lower
      - inputs.issue_number
      - step.branch_issue.outputs.title | slug
    register: proposed_branch
  - name: Preserve the active branch on resume
    value: state.common_state[inputs.repository].branch | catch(["runtime.value.state_missing"], step.proposed_branch.outputs.value)
    register: branch
  - name: Require a work branch
    gate:
      all:
        - step.branch.outputs.value | is_string
        - step.branch.outputs.value | trim | ne("")
        - step.branch.outputs.value != "main"
  - name: Probe local main ref
    uses: git.ref
    with:
      ref: "refs/heads/main"
    register: local_main
  - name: Fetch origin
    uses: git.sync.fetch
    with:
      remote: "origin"
  - name: Probe remote main ref
    uses: git.ref
    with:
      ref: "refs/remotes/origin/main"
    register: remote_main
  - name: Require main before branch preparation
    gate: step.remote_main.outputs.exists
  - name: Switch main
    if: step.local_main.outputs.exists
    uses: git.branch.switch
    with:
      branch: "main"
  - name: Merge origin/main ff-only
    if: step.local_main.outputs.exists and step.remote_main.outputs.exists
    uses: git.integrate.merge_ff_only
    with:
      ref: "refs/remotes/origin/main"
  - name: Probe target branch ref
    uses: git.ref
    with:
      ref:
        format: "refs/heads/{}"
        args:
        - step.branch.outputs.value
    register: target_branch
  - name: Switch existing target branch
    if: step.target_branch.outputs.exists
    uses: git.branch.switch
    with:
      branch: step.branch.outputs.value
  - name: Create target branch from local main
    if: not step.target_branch.outputs.exists and step.local_main.outputs.exists
    uses: git.branch.create
    with:
      branch: step.branch.outputs.value
      start_point: "refs/heads/main"
  - name: Create target branch from remote main
    if: not step.target_branch.outputs.exists and not step.local_main.outputs.exists
    uses: git.branch.create
    with:
      branch: step.branch.outputs.value
      start_point: "refs/remotes/origin/main"
  - name: Switch created target branch
    if: not step.target_branch.outputs.exists
    uses: git.branch.switch
    with:
      branch: step.branch.outputs.value
  - name: Remember issue number
    state_set:
      state.common_state[inputs.repository].issue_number: ${inputs.issue_number}
  - name: Remember branch
    state_set:
      state.common_state[inputs.repository].branch: ${step.branch.outputs.value}
  - name: Start task
    if: step.branch_project.outputs.type != "Story" and step.branch_project.outputs.status == "Ready"
    uses: gh.project.issue.field_single_select.set
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
      project_id: inputs.project_id
      field: "Status"
      option: "In progress"
  - name: Publish active task
    publish:
      summary: "Work branch prepared"
      branch: step.branch.outputs.value
