version: 0
workflow: pr-digest
inputs:
  pr_repository:
    description: Pull request repository in OWNER/REPO form
  pull_number:
    description: Pull request number
let:
  pull_ref: format("{}#{}", inputs.pr_repository, inputs.pull_number)
  pr: gh.pr(repository=inputs.pr_repository, pull_number=inputs.pull_number)
  pr_comments: gh.pr.comments(repository=inputs.pr_repository, pull_number=inputs.pull_number,
    limit=10)
  pr_reviews: gh.pr.reviews(repository=inputs.pr_repository, pull_number=inputs.pull_number,
    limit=5)
  pr_review_comments: gh.pr.review_comments(repository=inputs.pr_repository, pull_number=inputs.pull_number,
    limit=20)
  pr_checks: gh.pr.checks(repository=inputs.pr_repository, pull_number=inputs.pull_number)
  pr_diff: gh.pr.diff(repository=inputs.pr_repository, pull_number=inputs.pull_number)
  pr_timeline: gh.pr.timeline(repository=inputs.pr_repository, pull_number=inputs.pull_number,
    limit=10)
blocks:
- guards:
  - inputs.pr_repository | is_string
  - inputs.pr_repository | trim | ne("")
  - inputs.pull_number | is_integer
- guards:
  - git.repo.exists
- steps:
  - name: Build digest payload
    value:
      meta:
        title: pr.title
        url: pr.url
        author: pr.author
        state: pr.state
        draft: pr.draft
        mergeable: pr.mergeable
        mergeable_state: pr.mergeable_state
        review_decision: pr.review_decision
        additions: pr.additions
        deletions: pr.deletions
        changed_files: pr.changed_files
        commits_count: pr.commits_count
        head_sha: pr.head_sha
      discussion:
        comments: pr_comments.comments | only(author.login!="github-actions[bot]")
        comments_count: pr_comments.comments | only(author.login!="github-actions[bot]") | length
        reviews_count: pr_reviews.total_count
        reviews: pr_reviews.reviews
        review_comments_count: pr_review_comments.total_count
        review_comments: pr_review_comments.comments
      checks:
        overall_state: pr_checks.overall_state
        total_count: pr_checks.total_count
        success_count: pr_checks.success_count
        failed_count: pr_checks.failed_count
        pending_count: pr_checks.pending_count
        skipped_count: pr_checks.skipped_count
        checks: pr_checks.checks | only(conclusion!="success")
      diff:
        total_files: pr_diff.total_files
        files: pr_diff.files
      timeline:
        events: pr_timeline.events | only(event_type!="labeled")
        events_count: pr_timeline.events | only(event_type!="labeled") | length
    register: digest
  - name: Serialize digest payload to JSON text
    value: '${json->set(value) with{root: "{}", value: step.digest.outputs.value}}'
    register: digest_json
  - name: Publish pull request digest
    publish:
      summary: "Pull request digest loaded"
      pull_ref: pull_ref
      digest: step.digest_json.outputs.value
        | json..["head_sha"]->remove()
        | json..["commit_id"]->remove()
        | json..["original_commit_id"]->remove()
        | json..["id"]->remove()
        | json..["updated_at"]->remove()
        | json
