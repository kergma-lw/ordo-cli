version: 0
workflow: audit-secrets-tree
blocks:
- guards:
  - git.repo.exists
- steps:
  - name: Audit tracked worktree files with Gitleaks
    uses: routine.audit.gitleaks-tree
  - name: Publish scoped secrets audit result
    publish:
      summary: "Gitleaks found no potential secrets within the tracked-worktree scan scope."
      recommendation: "This is not a publication clearance. Review scanner limitations and separately audit Git history and untracked files intended for publication."
