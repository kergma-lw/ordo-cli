version: 0
workflow: set-task-priority
inputs:
  issue_number: {}
  repository: {}
  project_id: {}
  priority:
    hint: Use one of P0, P1, P2, P3
let:
  issue: gh.issue(repository=inputs.repository, issue_number=inputs.issue_number)
  project_issue: gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number,
    project_id=inputs.project_id)
blocks:
- guards:
  - git.repo.exists
  - issue.state == "OPEN"
  - project_issue.exists
  - project_issue.priority != inputs.priority
- steps:
  - name: Set task priority
    uses: gh.project.issue.field_single_select.set
    register: priority_update
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
      project_id: inputs.project_id
      field: "Priority"
      option: inputs.priority
  - name: Publish task priority result
    publish:
      summary: "Task priority updated"
      issue_ref: step.priority_update.outputs.issue_ref
      priority: step.priority_update.outputs.option
      changed: step.priority_update.outputs.changed
