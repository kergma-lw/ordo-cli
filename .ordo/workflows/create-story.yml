version: 0
workflow: create-story
inputs:
  repository:
    description: GitHub repository.
  project_id:
    description: GitHub project ID.
  title:
    description: Title.
  body:
    description: Body.
    hint: Include a '## Tasks' section with at least two top-level bullet items, for
      example '- owner/repo#123' and '- owner/repo#124'
let:
  project: gh.project(project_id=inputs.project_id)
  status_field: gh.project.field(project_id=inputs.project_id, field="Status")
  backlog_status_option: gh.project.field.option(project_id=inputs.project_id, field="Status",
    option="Backlog")
  type_field: gh.project.field(project_id=inputs.project_id, field="Type")
  story_type_option: gh.project.field.option(project_id=inputs.project_id, field="Type",
    option="Story")
blocks:
- guards:
  - git.repo.exists
- guards:
  - project.exists
  - status_field.exists
  - backlog_status_option.exists
  - type_field.exists
  - story_type_option.exists
  - 'is_present(inputs.body | markdown["Tasks"])'
  - 'is_present(inputs.body | markdown["Tasks"].list[1])'
- steps:
  - name: Create issue
    uses: gh.issue.create
    register: created_issue
    with:
      repository: inputs.repository
      title: inputs.title
      body: inputs.body
  - name: Add issue to project
    uses: gh.project.issue.add
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
  - name: Set story status
    uses: gh.project.issue.field_single_select.set
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
      field: "Status"
      option: "Backlog"
  - name: Set story type
    uses: gh.project.issue.field_single_select.set
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
      field: "Type"
      option: "Story"
  - name: Publish created story
    publish:
      summary: "Story created"
      issue_ref: step.created_issue.outputs.issue_ref
      issue_number: step.created_issue.outputs.number
      url: step.created_issue.outputs.url
      type: "Story"
