version: 0
workflow: set-active-profile
inputs:
  active_profile_key: active_profile
  profile: {}
  repo_kind: {}
  repo_dir: {}
  repository: {}
  project_id: {}
state_needs:
  shared_state: {}
blocks:
  - guards:
      - inputs.profile == "frontend" or inputs.profile == "backend" or inputs.profile == "meta"

  - steps:
      - name: Switch runtime profile
        profile_switch: ${inputs.profile}

      - name: Remember active profile
        state_set:
          state.shared_state[inputs.active_profile_key]: ${inputs.profile}
