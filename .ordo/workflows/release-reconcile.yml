version: 0
workflow: release-reconcile
inputs:
  repository:
    description: GitHub repository that owns the saved release request.
  tag:
    description: Exact release tag that identifies the saved request.
state_needs:
  common_state: {}
let:
  request_id: state.common_state[inputs.repository].release.request_id | catch(["runtime.value.state_missing"], null)
  saved_tag: state.common_state[inputs.repository].release.tag | catch(["runtime.value.state_missing"], null)
  expected_sha: state.common_state[inputs.repository].release.expected_sha | catch(["runtime.value.state_missing"], null)
  workflow: state.common_state[inputs.repository].release.workflow | catch(["runtime.value.state_missing"], null)
  workflow_ref: state.common_state[inputs.repository].release.workflow_ref | catch(["runtime.value.state_missing"], null)
blocks:
- guards:
  - git.repo.exists
  - inputs.repository | is_string
  - inputs.repository | trim | ne("")
  - inputs.tag | is_string
  - inputs.tag | trim | ne("")
  - request_id != null
  - saved_tag == inputs.tag
  - expected_sha != null
  - workflow == "release.yml"
  - workflow_ref != null
- steps:
  - name: Search correlated release runs
    if: request_id != null
    uses: gh.actions.run.search
    with:
      repository: inputs.repository
      workflow: workflow
      event: "workflow_dispatch"
      ref: workflow_ref
      request_id: request_id
    register: runs
  - name: Require complete release-run search
    gate: step.runs.outputs.complete == true
  - name: Reject ambiguous release-run correlation
    gate: step.runs.outputs.count | in([0, 1])
  - name: Report pending release correlation
    if: step.runs.outputs.count == 0
    publish:
      summary: "No correlated GitHub release run is visible yet; do not dispatch another release"
      request_id: request_id
      tag: inputs.tag
      expected_sha: expected_sha
  - name: Select the correlated release run
    if: step.runs.outputs.count == 1
    value: step.runs.outputs.items | first
    register: selected
  - name: Observe the correlated release run
    if: step.runs.outputs.count == 1
    uses: gh.actions.run
    with:
      repository: inputs.repository
      run_id: step.selected.outputs.value.run_id
      attempt: step.selected.outputs.value.run_attempt
    register: observed
  - name: Report non-successful release state
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion != "success"
    publish:
      request_id: request_id
      tag: inputs.tag
      expected_sha: expected_sha
      run_id: step.observed.outputs.run_id
      run_attempt: step.observed.outputs.run_attempt
      status: step.observed.outputs.status
      conclusion: step.observed.outputs.conclusion
      url: step.observed.outputs.url
      recommendation: "Run release-reconcile again while the run is pending; use release-abandon-failed only after GitHub reports a terminal unsuccessful result"
  - name: Require a completed successful release run
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion == "success"
    gate: step.observed.outputs.status == "completed"
  - name: Refresh remote tags after successful release
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion == "success"
    uses: git.sync.fetch-tags
    with:
      remote: "origin"
    register: fetched_tags
  - name: Inspect the released tag
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion == "success"
    uses: git.tag
    with:
      name: inputs.tag
    register: released_tag
  - name: Require the expected annotated release tag
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion == "success"
    gate:
      all:
        - step.released_tag.outputs.exists == true
        - step.released_tag.outputs.annotated == true
        - step.released_tag.outputs.target_type == "commit"
        - step.released_tag.outputs.target_oid == expected_sha
  - name: Publish confirmed release
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion == "success"
    publish:
      summary: "GitHub release workflow succeeded and the expected annotated tag is present"
      request_id: request_id
      tag: inputs.tag
      expected_sha: expected_sha
      run_id: step.observed.outputs.run_id
      url: step.observed.outputs.url
  - name: Clear confirmed release request
    if: step.runs.outputs.count == 1 and step.observed.outputs.conclusion == "success"
    state_delete: state.common_state[inputs.repository].release
