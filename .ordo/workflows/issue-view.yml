version: 0
workflow: issue-view
inputs:
  number:
    description: Issue number
  repository: {}
  project_id: {}
blocks:
- guards:
  - inputs.number | is_integer
- guards:
  - git.repo.exists
- steps:
  - name: Load issue
    uses: gh.issue
    with:
      repository: inputs.repository
      issue_number: inputs.number
    register: issue
  - name: Load project issue
    uses: gh.project.issue
    with:
      repository: inputs.repository
      issue_number: inputs.number
      project_id: inputs.project_id
    register: project_issue
  - name: Publish issue project context
    publish:
      summary: "Issue loaded"
      repository: inputs.repository
      issue_number: step.issue.outputs.number
      issue_ref:
        format: "{}#{}"
        args:
        - inputs.repository
        - step.issue.outputs.number
      title: step.issue.outputs.title
      state: step.issue.outputs.state
      url: step.issue.outputs.url
      author: step.issue.outputs.author
      assignees: step.issue.outputs.assignees
      labels: step.issue.outputs.labels
      body: step.issue.outputs.body
      in_project: step.project_issue.outputs.exists
      project_type: step.project_issue.outputs.type
      project_status: step.project_issue.outputs.status
      project_priority: step.project_issue.outputs.priority
      project_size: step.project_issue.outputs.size
      project_estimate: step.project_issue.outputs.estimate
      project_iteration: step.project_issue.outputs.iteration
