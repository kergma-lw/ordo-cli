version: 0
workflow: issue-comment
inputs:
  profile:
    description: Target profile name
  number:
    description: Issue number
  repository: {}
  body:
    description: Comment body
    hint: Use English comment text
let:
  issue: gh.issue(repository=inputs.repository, issue_number=inputs.number)
blocks:
- guards:
  - inputs.profile == "frontend" or inputs.profile == "backend" or inputs.profile
    == "meta"
  - inputs.number | is_integer
  - inputs.body | is_string
  - inputs.body | trim | ne("")
- steps:
  - name: Switch runtime profile
    profile_switch: ${inputs.profile}
- guards:
  - git.repo.exists
  - issue.state == "OPEN" or issue.state == "CLOSED"
- steps:
  - name: Add issue comment
    uses: gh.issue.comment.add
    with:
      repository: inputs.repository
      issue_number: inputs.number
      body: inputs.body
    register: added_comment
  - name: Publish issue comment
    publish:
      summary: "Issue comment added"
      url: step.added_comment.outputs.url
