args:
  item: string
blocks:
- steps:
  - name: Parse story repository
    value: 'text.before("/issues/") with{root: (text.after("https://github.com/")
      with{root: args.item})}'
    register: parsed_repository
  - name: Parse story issue number
    value: 'text.after("/issues/") with{root: args.item}'
    register: parsed_issue_number
  - name: Load story issue
    uses: gh.issue
    register: story_issue
    with:
      repository: step.parsed_repository.outputs.value
      issue_number: step.parsed_issue_number.outputs.value
  - name: Return story with labels
    result:
      repository: step.story_issue.outputs.repository.nameWithOwner
      issue_number: step.story_issue.outputs.number
      title: step.story_issue.outputs.title
      url: step.story_issue.outputs.url
      label_names: step.story_issue.outputs.labels | field("name")
