args:
  item: string
blocks:
- steps:
  - name: Parse task repository
    value: 'text.before("#") with{root: args.item}'
    register: parsed_repository
  - name: Parse task issue number
    value: 'text.after("#") with{root: args.item}'
    register: parsed_issue_number
  - name: Load task issue
    uses: gh.issue
    register: task_issue
    with:
      repository: step.parsed_repository.outputs.value
      issue_number: step.parsed_issue_number.outputs.value
  - name: Load task project item
    uses: gh.project.issue
    register: task_project_item
    with:
      repository: step.parsed_repository.outputs.value
      issue_number: step.parsed_issue_number.outputs.value
      project_id: inputs.project_id
  - name: Publish one ready story task
    if: step.task_project_item.outputs.status | eq("Ready") and ((step.task_project_item.outputs.type | eq("Task")) or (step.task_project_item.outputs.type | eq("Bug")))
    publish:
      format: "- {}#{} [{}] {} {}"
      args:
      - step.parsed_repository.outputs.value
      - step.parsed_issue_number.outputs.value
      - step.task_project_item.outputs.priority
      - step.task_issue.outputs.title
      - step.task_issue.outputs.url
