version: 0
workflow: create-task
inputs:
  repository:
    description: GitHub OWNER/REPO.
  project_id:
    description: GitHub project ID.
  title:
    description: English task title.
  body:
    description: English task scope and verification.
    hint: Use plain task body text only; do not include a '## Tasks' section
let:
  project: gh.project(project_id=inputs.project_id)
  status_field: gh.project.field(project_id=inputs.project_id, field="Status")
  backlog_status_option: gh.project.field.option(project_id=inputs.project_id, field="Status",
    option="Backlog")
  type_field: gh.project.field(project_id=inputs.project_id, field="Type")
  task_type_option: gh.project.field.option(project_id=inputs.project_id, field="Type",
    option="Task")
blocks:
- guards:
  - inputs.repository | is_string
  - inputs.repository | trim | ne("")
  - inputs.project_id | is_string
  - inputs.project_id | trim | ne("")
  - inputs.title | is_string
  - inputs.title | trim | ne("")
  - inputs.body | is_string
  - inputs.body | trim | ne("")
  - git.repo.exists
  - project.exists
  - status_field.exists
  - backlog_status_option.exists
  - type_field.exists
  - task_type_option.exists
  - 'is_missing(inputs.body | markdown["Tasks"])'
- steps:
  - name: Create issue
    uses: gh.issue.create
    register: created_issue
    with:
      repository: inputs.repository
      title: inputs.title
      body: inputs.body
  - name: Add issue to project
    uses: gh.project.issue.add
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
  - name: Confirm project membership
    uses: gh.project.issue
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
    register: membership
  - name: Require project membership
    gate: step.membership.outputs.exists
  - name: Set task status
    uses: gh.project.issue.field_single_select.set
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
      field: "Status"
      option: "Backlog"
  - name: Set task type
    uses: gh.project.issue.field_single_select.set
    with:
      repository: inputs.repository
      issue_number: step.created_issue.outputs.number
      project_id: inputs.project_id
      field: "Type"
      option: "Task"
  - name: Publish created task
    publish:
      summary: "Task created"
      issue_ref: step.created_issue.outputs.issue_ref
      issue_number: step.created_issue.outputs.number
      url: step.created_issue.outputs.url
      type: "Task"
