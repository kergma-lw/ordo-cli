version: 0
workflow: merge-task
inputs:
  repository:
    description: GitHub OWNER/REPO containing the published task PR.
  base_branch:
    default: main
    description: Expected PR target branch.
  merge_method:
    default: squash
    description: GitHub merge method (merge, squash, or rebase).
state_needs:
  common_state: {}
let:
  issue_number: state.common_state[inputs.repository].issue_number | catch(["runtime.value.state_missing"], null)
  branch: state.common_state[inputs.repository].branch | catch(["runtime.value.state_missing"], null)
  pull_number: state.common_state[inputs.repository].pull_number | catch(["runtime.value.state_missing"], null)
  published_head_sha: state.common_state[inputs.repository].published_head_sha | catch(["runtime.value.state_missing"], null)
  request_id: state.common_state[inputs.repository].merge_request_id | catch(["runtime.value.state_missing"], null)
  merge_attempted: state.common_state[inputs.repository].merge_attempted | catch(["runtime.value.state_missing"], false)
blocks:
- guards:
  - inputs.repository | is_string
  - inputs.repository | trim | ne("")
  - inputs.base_branch | is_string
  - inputs.base_branch | trim | ne("")
  - inputs.merge_method | in(["merge", "squash", "rebase"])
  - issue_number | is_integer
  - issue_number | ne(0)
  - branch | is_string
  - branch | trim | ne("")
  - branch != inputs.base_branch
  - pull_number | is_integer
  - pull_number | ne(0)
  - published_head_sha | is_string and published_head_sha | trim | ne("")
  - request_id == null or request_id | is_string
  - request_id == null or request_id | trim | ne("")
  - merge_attempted | is_boolean
- steps:
  - name: Snapshot published task context
    value:
      issue_number: issue_number
      branch: branch
      pull_number: pull_number
      published_head_sha: published_head_sha
      request_id: request_id
      merge_attempted: merge_attempted
    register: context
  - name: Inspect published PR
    uses: gh.pr
    with:
      repository: inputs.repository
      pull_number: step.context.outputs.value.pull_number
    register: pr
  - name: Require the published PR identity
    gate:
      all:
        - step.pr.outputs.number == step.context.outputs.value.pull_number
        - step.pr.outputs.head_repository | lower | eq(inputs.repository | lower)
        - step.pr.outputs.base_repository | lower | eq(inputs.repository | lower)
        - step.pr.outputs.head_ref == step.context.outputs.value.branch
        - step.pr.outputs.base_ref == inputs.base_branch
        - step.pr.outputs.merged | is_boolean
        - step.pr.outputs.merged == true or step.pr.outputs.state == "open"
      on_fail:
        expected_repository: inputs.repository
        expected_branch: step.context.outputs.value.branch
        expected_base: inputs.base_branch
        expected_pull_number: step.context.outputs.value.pull_number
        observed_pull_number: step.pr.outputs.number
        observed_head_repository: step.pr.outputs.head_repository
        observed_base_repository: step.pr.outputs.base_repository
        observed_head_ref: step.pr.outputs.head_ref
        observed_base_ref: step.pr.outputs.base_ref
        observed_head_sha: step.pr.outputs.head_sha
        published_head_sha: step.context.outputs.value.published_head_sha
        observed_state: step.pr.outputs.state
        observed_merged: step.pr.outputs.merged
        url: step.pr.outputs.url
  - name: Report already merged PR
    if: step.pr.outputs.merged == true
    publish:
      summary: "PR already merged; run close-task"
      merged: true
      pull_number: step.context.outputs.value.pull_number
      merge_commit_sha: step.pr.outputs.merge_commit_sha
      url: step.pr.outputs.url
  - name: Observe saved merge request
    run: merge-task/observe-saved-request
    if: step.pr.outputs.merged == false and step.context.outputs.value.request_id != null
    with:
      context: ${step.context.outputs.value}
      pr: ${step.pr.outputs}
  - name: Submit first merge request
    run: merge-task/submit-first-request
    if:
      all:
        - step.pr.outputs.merged == false
        - step.context.outputs.value.request_id == null
        - step.context.outputs.value.merge_attempted == false
    with:
      context: ${step.context.outputs.value}
      pr: ${step.pr.outputs}
  - name: Reconcile uncertain merge request
    run: merge-task/reconcile-uncertain-request
    if:
      all:
        - step.pr.outputs.merged == false
        - step.context.outputs.value.request_id == null
        - step.context.outputs.value.merge_attempted == true
    with:
      context: ${step.context.outputs.value}
      pr: ${step.pr.outputs}
