version: 0
workflow: close-task
inputs:
  issue_number: {}
  verify_command: ""
  close_comment: ""
  ship: false
blocks:
  - guards:
      - uses: git.repo
      - inputs.ship == true
      - git.worktrees.count == 1
      - git.stash.count == 0
      - gh.issue(repository=inputs.repository, issue_number=inputs.issue_number).state == "OPEN"
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).exists
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).status == "In review"

  - steps:
      - name: verify
        if: ${inputs.verify_command | ne("")}
        uses: shell.command
        with:
          command: ${inputs.verify_command}

  - guards:
      - git.worktree.clean
      - git.branch.value != "main"

  - include: includes/git/merge-task-branch-into-main

  - steps:
      - name: close-issue
        uses: gh.issue.close
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}

  - run: includes/github/comment-and-set-status
    with:
      comment: ${inputs.close_comment}
      status: Done
