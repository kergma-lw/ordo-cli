version: 0
workflow: task-to-ready
inputs:
  repository:
    description: GitHub OWNER/REPO.
  project_id:
    description: GitHub project ID.
  issue_number:
    description: Task or bug to move from Backlog to Ready.
let:
  issue: gh.issue(repository=inputs.repository, issue_number=inputs.issue_number)
  project_issue: gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number,
    project_id=inputs.project_id)
  issue_body: gh.issue(repository=inputs.repository, issue_number=inputs.issue_number).body
blocks:
- guards:
  - inputs.repository | is_string
  - inputs.repository | trim | ne("")
  - inputs.project_id | is_string
  - inputs.project_id | trim | ne("")
  - inputs.issue_number | is_integer
  - git.repo.exists
- guards:
  - issue.state == "OPEN"
  - project_issue.exists
  - project_issue.type == "Task" or project_issue.type == "Bug"
  - project_issue.status == "Backlog"
  - gh.project.field(project_id=inputs.project_id, field="Status").exists
  - gh.project.field.option(project_id=inputs.project_id, field="Status", option="Ready").exists
  - 'is_present(issue_body | markdown["Scope"])'
  - 'is_present(issue_body | markdown["Verification"]) or is_present(issue_body | markdown["Tests"])'
- steps:
  - name: Set task status to Ready
    uses: gh.project.issue.field_single_select.set
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
      project_id: inputs.project_id
      field: "Status"
      option: "Ready"
  - name: Publish ready task
    publish:
      summary: "Task set to Ready"
      issue_ref:
        format: "{}#{}"
        args:
        - inputs.repository
        - inputs.issue_number
      issue_number: inputs.issue_number
      status: "Ready"
