version: 0
workflow: set-task-size
inputs:
  active_profile_key: active_profile
  issue_number: {}
  repo_kind: {}
  repo_dir: {}
  repository: {}
  project_id: {}
  size:
    hint: Use one of XS, S, M, L, XL
blocks:
  - guards:
      - git.repo
      - gh.issue(repository=inputs.repository, issue_number=inputs.issue_number).state == "OPEN"
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).exists
      - gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number, project_id=inputs.project_id).size != inputs.size

  - steps:
      - name: Set task size
        uses: gh.project.issue.size.set
        register: size_update
        with:
          repository: ${inputs.repository}
          issue_number: ${inputs.issue_number}
          project_id: ${inputs.project_id}
          size: ${inputs.size}

      - name: Publish task size result
        result:
          summary: Task size updated
          issue_ref: ${step.size_update.outputs.issue_ref}
          size: ${step.size_update.outputs.size}
          changed: ${step.size_update.outputs.changed}
