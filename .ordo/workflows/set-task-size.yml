version: 0
workflow: set-task-size
inputs:
  issue_number:
    description: Issue number.
  repository:
    description: GitHub repository.
  project_id:
    description: GitHub project ID.
  size:
    description: Task size (XS, S, M, L, or XL).
    allowed_values: [XS, S, M, L, XL]
let:
  issue: gh.issue(repository=inputs.repository, issue_number=inputs.issue_number)
  project_issue: gh.project.issue(repository=inputs.repository, issue_number=inputs.issue_number,
    project_id=inputs.project_id)
blocks:
- guards:
  - git.repo.exists
  - issue.state == "OPEN"
  - project_issue.exists
  - project_issue.size != inputs.size
- steps:
  - name: Set task size
    uses: gh.project.issue.field_single_select.set
    register: size_update
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
      project_id: inputs.project_id
      field: "Size"
      option: inputs.size
  - name: Publish task size result
    publish:
      summary: "Task size updated"
      issue_ref: step.size_update.outputs.issue_ref
      size: step.size_update.outputs.option
      changed: step.size_update.outputs.changed
