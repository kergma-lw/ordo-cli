version: 1
routines:
  audit.bandit:
    kind: probe
    summary: Scan tracked production Python with pinned Bandit and sanitized findings.
    implementation:
      argv:
      - ".ordo/scripts/audit-bandit.sh"
    outputs:
      mode: data
      format: json
    failure_modes:
    - findings
    - scan_incomplete
    - runtime_unavailable
  audit.semgrep:
    kind: probe
    summary: Scan tracked production Python with pinned Semgrep CE and four local review rules.
    implementation:
      argv:
      - ".ordo/scripts/audit-semgrep.sh"
    outputs:
      mode: data
      format: json
    failure_modes:
    - findings
    - scan_incomplete
    - runtime_unavailable
  audit.pip-audit:
    kind: probe
    summary: Audit exact installed runtime dependencies through PyPI only with explicit network consent.
    args:
      allow_network:
        type: boolean
        required: true
    implementation:
      argv:
      - ".ordo/scripts/audit-pip-audit.sh"
      - "{allow_network}"
    outputs:
      mode: data
      format: json
    failure_modes:
    - findings
    - scan_incomplete
    - runtime_unavailable
  audit.shellcheck:
    kind: probe
    summary: Check tracked shell files with pinned ShellCheck without executing their contents.
    implementation:
      argv:
      - ".ordo/scripts/audit-shellcheck.sh"
    outputs:
      mode: data
      format: json
    failure_modes:
    - findings
    - scan_incomplete
    - runtime_unavailable
  audit.publication-inventory:
    kind: action
    summary: Inventory artifact paths and privacy-context candidates without declaring them leaks or approving publication.
    implementation:
      argv:
      - ".ordo/scripts/audit-publication-inventory.sh"
    failure_modes:
    - inventory_incomplete
    - runtime_unavailable
  audit.gitleaks-metadata:
    kind: action
    summary: Audit local reachable commit and annotated tag metadata with pinned Gitleaks and sanitized output.
    implementation:
      argv:
      - ".ordo/scripts/audit-gitleaks-metadata.sh"
    failure_modes:
    - secrets_found
    - scan_incomplete
    - runtime_unavailable
  audit.gitleaks-history:
    kind: action
    summary: Audit locally reachable commit patches with pinned Gitleaks and sanitized output.
    implementation:
      argv:
      - ".ordo/scripts/audit-gitleaks-history.sh"
    failure_modes:
    - secrets_found
    - scan_incomplete
    - runtime_unavailable
  audit.gitleaks-tree:
    kind: action
    summary: Audit tracked worktree files with pinned Gitleaks and sanitized output.
    implementation:
      argv:
      - ".ordo/scripts/audit-gitleaks-tree.sh"
    failure_modes:
    - secrets_found
    - scan_incomplete
    - runtime_unavailable
  meta.build-domain-packs:
    kind: action
    summary: Regenerate derived meta packs from source docs.
    implementation:
      argv:
      - ".ordo/scripts/build-domain-packs.sh"
    failure_modes:
    - runtime_unavailable
    - packs_build_failed
  verify.run-all-tests:
    kind: action
    summary: Run the full repository pytest suite through the project-local virtual environment.
    implementation:
      argv:
      - ".ordo/scripts/run-all-tests.sh"
    failure_modes:
    - tests_failed
    - runtime_unavailable
  review.render-open-diff:
    kind: probe
    summary: Render the current branch diff versus main into a temporary HTML file
      and try to open it locally.
    args:
      issue_number:
        type: string
        required: true
    implementation:
      argv:
      - ".ordo/scripts/render-review-diff.py"
      - "{issue_number}"
    outputs:
      mode: data
      format: json
    failure_modes:
    - diff_render_failed
    - viewer_launch_failed
    - runtime_unavailable
  help.snippet-coverage.uncovered-list:
    kind: probe
    summary: Return the current list of public help handles that still have no snippet-backed examples.
    implementation:
      argv:
      - ".ordo/scripts/list-uncovered-help-snippets.py"
    outputs:
      mode: data
      format: json
    failure_modes:
    - help_discovery_failed
    - snippet_coverage_parse_failed
    - runtime_unavailable
  help.describe-readiness.not-ready-list:
    kind: probe
    summary: Return the current list of public help handles whose describe surfaces are not yet marked ready.
    implementation:
      argv:
      - ".ordo/scripts/list-not-ready-describe-handles.py"
    outputs:
      mode: data
      format: json
    failure_modes:
    - help_discovery_failed
    - snippet_coverage_parse_failed
    - runtime_unavailable
