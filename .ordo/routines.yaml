version: 1
routines:
  meta.build-domain-packs:
    kind: action
    summary: Regenerate derived meta packs from source docs.
    implementation:
      argv:
      - ".ordo/scripts/build-domain-packs.sh"
    failure_modes:
    - runtime_unavailable
    - packs_build_failed
  review.render-open-diff:
    kind: probe
    summary: Render the current branch diff versus main into a temporary HTML file
      and try to open it locally.
    args:
      issue_number:
        type: string
        required: true
    implementation:
      argv:
      - ".ordo/scripts/render-review-diff.py"
      - "{issue_number}"
    outputs:
      mode: data
      format: json
    failure_modes:
    - diff_render_failed
    - viewer_launch_failed
    - runtime_unavailable
