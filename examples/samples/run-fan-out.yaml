version: 0
workflow: run-fan-out
inputs:
  enabled: {}
  issue_numbers: {}
blocks:
- steps:
  - name: Review each issue
    run: examples/samples/fragments/check-issue.yaml
    with:
      repository: "acme/widgets"
      issue_number: item
    for_each: inputs.issue_numbers
    if: inputs.enabled
    register: reviewed_issues
  - name: Check issue review fan-out
    run: examples/samples/fragments/check-issue.yaml
    with:
      repository: "acme/widgets"
      issue_number: inputs.issue_numbers | first
    gate:
      all:
        - inputs.enabled
        - inputs.issue_numbers | length != 0
  - name: Publish each issue
    for_each: inputs.issue_numbers
    if: inputs.enabled
    steps:
    - name: Publish issue item
      publish:
        issue_number: item
