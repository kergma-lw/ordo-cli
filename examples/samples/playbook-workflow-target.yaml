version: 0
workflow: remember-profile
inputs:
  active_profile_key:
    description: Shared-state key containing the remembered profile
  repo_dir:
    description: Optional working directory for this launch entry
    required: false
  output_format:
    description: Result presentation format
    default: text
    allowed_values: [text, json]
state_needs:
  shared_state: {}
let:
  active_profile: state.shared_state[inputs.active_profile_key]
blocks:
  - steps:
      - name: Announce active profile
        value: active_profile
