version: 0
workflow: close-task
inputs:
  repository: kergma-lw/checklist-backend
  issue_number: 16
  task_key: checklist-backend-16
  ship: true
state_needs:
  task_memory: {}
blocks:
- guards:
  # Require a clean non-main branch for an open issue.
  - git.worktree.clean
  - git.branch.value != "main"
  - gh.issue(repository=inputs.repository, issue_number=inputs.issue_number).state
    == "OPEN"
- steps:
  # Verify and integrate the task branch.
  - name: Run verification
    uses: shell.command
    with:
      command: ".venv/bin/python -m pytest"
  - name: Fast-forward main branch
    uses: git.integrate.merge_ff_only
    with:
      ref: state.task_memory[inputs.task_key].branch

  # Close the issue and clear task state.
  - name: Close issue
    uses: gh.issue.close
    with:
      repository: inputs.repository
      issue_number: inputs.issue_number
  - name: Forget task branch
    state_delete: state.task_memory[inputs.task_key].branch
