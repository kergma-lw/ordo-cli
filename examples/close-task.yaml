version: 0
workflow: close-task

inputs:
  issue: kergma-lw/checklist-backend#16
  ship: true

guards:
  - uses: git.clean_worktree
  - uses: git.branch_not_main
  - uses: gh.issue_status
    with:
      issue: ${inputs.issue}
      equals: In review

steps:
  - name: verify
    uses: shell.command
    with:
      command: .venv/bin/python -m pytest

  - name: merge-main
    uses: git.merge_to_main_ff

  - name: close-issue
    uses: gh.close_issue
    with:
      issue: ${inputs.issue}
