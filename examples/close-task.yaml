version: 0
workflow: close-task

inputs:
  issue: kergma-lw/checklist-backend#16
  ship: true

guards:
  - git.worktree.clean
  - git.branch.value != "main"
  - gh.issue(issue=inputs.issue).status == "OPEN"

steps:
  - name: verify
    uses: shell.command
    with:
      command: .venv/bin/python -m pytest

  - name: merge-main
    uses: git.merge_to_main_ff

  - name: close-issue
    uses: gh.close_issue
    with:
      issue: ${inputs.issue}
