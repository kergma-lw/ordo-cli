version: 0
workflow: open-task

inputs:
  issue: kergma-lw/checklist-backend#16
  branch: keep
  iteration: current

guards:
  - uses: git.single_worktree
  - git.worktree.clean
  - gh.issue(issue=inputs.issue).project.member
  - gh.issue(issue=inputs.issue).status == "OPEN"

steps:
  - name: move-issue-to-in-progress
    uses: gh.project_set_status
    with:
      issue: ${inputs.issue}
      status: In progress

  - name: set-current-iteration
    uses: gh.project_set_iteration
    with:
      issue: ${inputs.issue}
      value: ${inputs.iteration}

  - name: sync-main
    uses: git.sync.fetch
    with:
      remote: origin

  - name: create-or-switch-task-branch
    uses: git.branch.switch
    with:
      branch: ${inputs.branch}
