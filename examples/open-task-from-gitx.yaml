version: 0
workflow: open-task

inputs:
  issue_ref: kergma-lw/checklist-backend#16
  project_id: PVT_kwDOBQfyUc4A3Q3j
  issue_number: 16
  title: Keep issue workflow in sync
  type: Task
  iteration: Sprint 12

states:
  task_state: .ordo/task-state.json

guards:
  - uses: git.single_worktree
  - git.worktree.clean
  - gh.issue(issue_ref=inputs.issue_ref).state == "OPEN"

steps:
  - name: move-issue-to-in-progress
    uses: gh.project.issue.status.set
    with:
      issue_ref: ${inputs.issue_ref}
      project_id: ${inputs.project_id}
      status: In progress

  - name: set-current-iteration
    uses: gh.project.issue.iteration.set
    with:
      issue_ref: ${inputs.issue_ref}
      project_id: ${inputs.project_id}
      iteration: ${inputs.iteration}

  - name: sync-main
    uses: git.sync.fetch
    with:
      remote: origin

  - name: create-or-switch-task-branch
    uses: git.branch.switch
    with:
      branch:
        format: "{}/{}-{}"
        args:
          - ${inputs.type | lower}
          - ${inputs.issue_number}
          - ${inputs.title | slug}

  - name: remember-task-branch
    state_set:
      states.task_state[inputs.issue_ref].branch:
        format: "{}/{}-{}"
        args:
          - ${inputs.type | lower}
          - ${inputs.issue_number}
          - ${inputs.title | slug}
