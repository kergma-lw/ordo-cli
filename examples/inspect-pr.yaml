version: 0
workflow: inspect-pr
inputs:
  repository: kergma-lw/ordo-cli # Literal ASCII OWNER/REPO, not a URL; explicit other repositories remain allowed.
  pull_number: 42
blocks:
- steps:
  # Load pull request content.
  - name: Load pull request
    uses: gh.pr
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
    register: pr
  - name: Load pull request diff
    uses: gh.pr.diff
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
      limit: 20
    register: pr_diff

  # Load discussion and review activity.
  - name: Load pull request comments
    uses: gh.pr.comments
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
      limit: 20
    register: pr_comments
  - name: Load pull request reviews
    uses: gh.pr.reviews
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
      limit: 20
    register: pr_reviews
  - name: Load pull request review comments
    uses: gh.pr.review_comments
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
      limit: 20
    register: pr_review_comments

  # Load checks and timeline activity.
  - name: Load pull request checks
    uses: gh.pr.checks
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
    register: pr_checks
  - name: Load pull request timeline
    uses: gh.pr.timeline
    with:
      repository: inputs.repository
      pull_number: inputs.pull_number
      limit: 20
    register: pr_timeline

  - name: Publish pull request inspection
    publish:
      summary: "Pull request inspection loaded"
      pull_ref:
        format: "{}#{}"
        args:
        - inputs.repository
        - inputs.pull_number
      title: step.pr.outputs.title
      head_sha: step.pr.outputs.head_sha
      changed_file_count: step.pr_diff.outputs.total_files
      comment_count: step.pr_comments.outputs.total_count
      review_count: step.pr_reviews.outputs.total_count
      review_comment_count: step.pr_review_comments.outputs.total_count
      check_count: step.pr_checks.outputs.total_count
      timeline_count: step.pr_timeline.outputs.total_count
